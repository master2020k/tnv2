<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Spotify Clone</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<link
    rel="stylesheet"
    href="c.css"
>
</head> <body>
<!-- =========================
     SIDEBAR
========================== -->

<aside class="sidebar">

    <div class="logo">
        <i class="fab fa-spotify"></i>
        <span>Spotify</span>
    </div>


    <nav class="main-nav">

        <a
            href="#"
            class="nav-link active"
            onclick="showHome(event)"
        >
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>


        <a
            href="#"
            class="nav-link"
            onclick="focusSearch(event)"
        >
            <i class="fas fa-magnifying-glass"></i>
            <span>Search</span>
        </a>


        <a
            href="#"
            class="nav-link"
            onclick="showLiked(event)"
        >
            <i class="fas fa-heart"></i>
            <span>Liked Songs</span>
        </a>


        <a
            href="#"
            class="nav-link"
            onclick="showPlaylist(event)"
        >
            <i class="fas fa-list"></i>
            <span>Playlist</span>
        </a>

    </nav>


    <div class="sidebar-title">
        YOUR PLAYLIST
    </div>


    <div id="playlist"></div>

</aside>


<!-- =========================
     MAIN
========================== -->

<main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                id="search"
                type="text"
                placeholder="What do you want to play?"
                autocomplete="off"
            >

        </div>


        <div class="profile">

            <img
                src="https://via.placeholder.com/70"
                alt="Profile"
            >

        </div>

    </header>


    <!-- CONTENT -->

    <section class="content">

        <div class="section-header">

            <div>

                <p class="small-title">
                    LISTEN NOW
                </p>

                <h1 id="pageTitle">
                    Popular Songs
                </h1>

            </div>

        </div>


        <div
            class="songs"
            id="songs"
        ></div>

    </section>

</main>


<!-- =========================
     PLAYER
========================== -->

<footer class="player">

    <!-- SONG INFO -->

    <div class="player-song">

        <img
            id="cover"
            src="img/default.jpg"
            alt="Album Cover"
        >


        <div class="song-info">

            <h3 id="title">
                Select a Song
            </h3>

            <p id="artist">
                Artist
            </p>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="player-center">

        <div class="controls">

            <button
                type="button"
                onclick="previous()"
                aria-label="Previous"
            >
                <i class="fas fa-backward-step"></i>
            </button>


            <button
                type="button"
                id="play"
                class="play-btn"
                onclick="playPause()"
                aria-label="Play"
            >
                <i class="fas fa-play"></i>
            </button>


            <button
                type="button"
                onclick="next()"
                aria-label="Next"
            >
                <i class="fas fa-forward-step"></i>
            </button>


            <button
                type="button"
                id="likeBtn"
                onclick="like()"
                aria-label="Like"
            >
                <i class="far fa-heart"></i>
            </button>

        </div>


        <div class="progress-area">

            <span id="currentTime">
                0:00
            </span>


            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >


            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <!-- VOLUME -->

    <div class="player-volume">

        <i
            id="volumeIcon"
            class="fas fa-volume-high"
        ></i>


        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</footer>


<audio id="audio"></audio>


<script src="j.js"></script>
</body> </html>
